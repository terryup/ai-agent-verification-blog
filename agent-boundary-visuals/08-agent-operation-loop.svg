    <path d="M700 218 C855 218 980 286 1030 394" stroke="#2563EB" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
    <path d="M980 456 C905 568 760 608 620 566" stroke="#0F766E" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
