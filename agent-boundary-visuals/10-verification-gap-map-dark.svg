<svg width="1400" height="760" viewBox="0 0 1400 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="145%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="panel" x1="90" y1="158" x2="1310" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1F3D"/>
      <stop offset="0.55" stop-color="#1E1E32"/>
      <stop offset="1" stop-color="#2D2006"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="760" rx="28" fill="#1A1A2E"/>
  <g font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="70" y="78" fill="#E8E8F0" font-size="36" font-weight="900">AI Agent 的验证为什么难？</text>
    <text x="72" y="118" fill="#8899AA" font-size="20">难点不是“写不出来”，而是 Agent 缺少能证明自己写对的工程现场。</text>

    <g filter="url(#shadow)">
      <rect x="78" y="160" width="1244" height="490" rx="34" fill="url(#panel)" stroke="#2A2A3E"/>
    </g>

    <rect x="528" y="236" width="344" height="172" rx="30" fill="#E8E8F0"/>
    <text x="700" y="292" text-anchor="middle" fill="#1E1E32" font-size="29" font-weight="900">Agent 的盲区</text>
    <text x="700" y="334" text-anchor="middle" fill="#333348" font-size="18">代码能生成，但证据不自动出现</text>
    <text x="700" y="370" text-anchor="middle" fill="#2563EB" font-size="17" font-weight="900">需要人为把“不可证明”转成“可取证”</text>

    <g>
      <rect x="128" y="222" width="300" height="138" rx="24" fill="#1E1E32" stroke="#EF4444"/>
      <rect x="158" y="248" width="56" height="32" rx="16" fill="#2D0A0A"/>
      <text x="186" y="270" text-anchor="middle" fill="#B91C1C" font-size="15" font-weight="900">01</text>
      <text x="238" y="272" fill="#B91C1C" font-size="22" font-weight="900">环境不可得</text>
      <text x="158" y="312" fill="#8899AA" font-size="16">设备、权限、账号、外部服务</text>
      <text x="158" y="338" fill="#0F766E" font-size="16" font-weight="900">解法：fake + 真实环境验收门</text>
    </g>

    <g>
      <rect x="972" y="222" width="300" height="138" rx="24" fill="#1E1E32" stroke="#F59E0B"/>
      <rect x="1002" y="248" width="56" height="32" rx="16" fill="#2D2006"/>
      <text x="1030" y="270" text-anchor="middle" fill="#B45309" font-size="15" font-weight="900">02</text>
      <text x="1082" y="272" fill="#B45309" font-size="22" font-weight="900">状态不可复现</text>
      <text x="1002" y="312" fill="#8899AA" font-size="16">时序、会话、缓存、历史数据</text>
      <text x="1002" y="338" fill="#0F766E" font-size="16" font-weight="900">解法：最小复现 + 回放样本</text>
    </g>

    <g>
      <rect x="128" y="446" width="300" height="138" rx="24" fill="#1E1E32" stroke="#2563EB"/>
      <rect x="158" y="472" width="56" height="32" rx="16" fill="#0D1F3D"/>
      <text x="186" y="494" text-anchor="middle" fill="#1D4ED8" font-size="15" font-weight="900">03</text>
      <text x="238" y="496" fill="#1D4ED8" font-size="22" font-weight="900">结果不可观测</text>
      <text x="158" y="536" fill="#8899AA" font-size="16">没有日志、指标、trace</text>
      <text x="158" y="562" fill="#0F766E" font-size="16" font-weight="900">解法：观测补点 + 证据日志</text>
    </g>

    <g>
      <rect x="972" y="446" width="300" height="138" rx="24" fill="#1E1E32" stroke="#8B5CF6"/>
      <rect x="1002" y="472" width="56" height="32" rx="16" fill="#1A0D2E"/>
      <text x="1030" y="494" text-anchor="middle" fill="#6D28D9" font-size="15" font-weight="900">04</text>
      <text x="1082" y="496" fill="#6D28D9" font-size="22" font-weight="900">责任不可证明</text>
      <text x="1002" y="536" fill="#8899AA" font-size="16">Agent 说完成，但证据链断了</text>
      <text x="1002" y="562" fill="#0F766E" font-size="16" font-weight="900">解法：证据门禁 + 失败回喂</text>
    </g>

    <path d="M438 290 C470 290 493 298 528 320" stroke="#333348" stroke-width="3"/>
    <path d="M972 290 C940 290 912 300 872 320" stroke="#333348" stroke-width="3"/>
    <path d="M438 514 C492 500 520 458 548 406" stroke="#333348" stroke-width="3"/>
    <path d="M972 514 C918 500 890 458 862 406" stroke="#333348" stroke-width="3"/>

    <rect x="288" y="676" width="824" height="48" rx="24" fill="#E8E8F0"/>
    <text x="700" y="707" text-anchor="middle" fill="#1E1E32" font-size="18" font-weight="900">验证策略的核心：把 Agent 看不到的工程现场，变成它能读取的证据</text>
  </g>
</svg>
