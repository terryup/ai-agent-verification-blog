<svg width="1400" height="760" viewBox="0 0 1400 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="145%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="ladder" x1="210" y1="178" x2="900" y2="628" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FEF2F2"/>
      <stop offset="0.5" stop-color="#EFF6FF"/>
      <stop offset="1" stop-color="#ECFDF5"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="760" rx="28" fill="#F8FAFC"/>
  <g font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="70" y="78" fill="#172033" font-size="36" font-weight="900">不要问“能不能用”，要让 Agent 逐层交证据</text>
    <text x="72" y="118" fill="#64748B" font-size="20">先拿低层事实，再逐步逼近真实环境。</text>

    <g filter="url(#shadow)">
      <rect x="88" y="168" width="1224" height="474" rx="34" fill="#FFFFFF" stroke="#D8E2EE"/>
    </g>

    <rect x="160" y="214" width="548" height="352" rx="30" fill="url(#ladder)" stroke="#CBD5E1"/>
    <path d="M216 510 H652" stroke="#FFFFFF" stroke-width="4"/>
    <path d="M246 442 H622" stroke="#FFFFFF" stroke-width="4"/>
    <path d="M276 374 H592" stroke="#FFFFFF" stroke-width="4"/>
    <path d="M306 306 H562" stroke="#FFFFFF" stroke-width="4"/>
    <path d="M336 238 H532" stroke="#FFFFFF" stroke-width="4"/>

    <text x="434" y="269" text-anchor="middle" fill="#B91C1C" font-size="20" font-weight="900">真实环境证据</text>
    <text x="434" y="337" text-anchor="middle" fill="#B45309" font-size="20" font-weight="900">集成链路证据</text>
    <text x="434" y="405" text-anchor="middle" fill="#0F766E" font-size="20" font-weight="900">模块行为证据</text>
    <text x="434" y="473" text-anchor="middle" fill="#1D4ED8" font-size="20" font-weight="900">构建和静态证据</text>
    <text x="434" y="541" text-anchor="middle" fill="#475569" font-size="20" font-weight="900">分析和设计证据</text>

    <rect x="768" y="214" width="470" height="76" rx="22" fill="#FEF2F2" stroke="#FCA5A5"/>
    <text x="804" y="245" fill="#B91C1C" font-size="18" font-weight="900">真实环境证据</text>
    <text x="804" y="270" fill="#64748B" font-size="15">交付联调脚本、trace 字段、归因口径</text>

    <rect x="768" y="306" width="470" height="76" rx="22" fill="#FFF7ED" stroke="#FDBA74"/>
    <text x="804" y="337" fill="#B45309" font-size="18" font-weight="900">集成链路证据</text>
    <text x="804" y="362" fill="#64748B" font-size="15">交付最小 probe，拒绝理论说明</text>

    <rect x="768" y="398" width="470" height="76" rx="22" fill="#F0FDFA" stroke="#99F6E4"/>
    <text x="804" y="429" fill="#0F766E" font-size="18" font-weight="900">模块行为证据</text>
    <text x="804" y="454" fill="#64748B" font-size="15">交付 fake、mock、边界样本、断言</text>

    <rect x="768" y="490" width="470" height="76" rx="22" fill="#EFF6FF" stroke="#93C5FD"/>
    <text x="804" y="521" fill="#1D4ED8" font-size="18" font-weight="900">低层证据</text>
    <text x="804" y="546" fill="#64748B" font-size="15">交付命令、输出、失败原因、修复 diff</text>

    <rect x="330" y="652" width="740" height="48" rx="24" fill="#172033"/>
    <text x="700" y="683" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="900">层级的价值：让 Agent 从“我觉得可以”变成“我拿到了这一层证据”</text>
  </g>
