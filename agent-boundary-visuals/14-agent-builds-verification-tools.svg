<svg width="1400" height="760" viewBox="0 0 1400 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="145%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#0F172A" flood-opacity="0.11"/>
    </filter>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="11" refY="8" orient="auto">
      <path d="M2 2 L14 8 L2 14 Z" fill="#2563EB"/>
    </marker>
  </defs>
  <rect width="1400" height="760" rx="28" fill="#F8FAFC"/>
  <g font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif">
    <g filter="url(#shadow)">
      <rect x="88" y="94" width="1224" height="560" rx="36" fill="#FFFFFF" stroke="#D8E2EE"/>
    </g>

    <rect x="146" y="208" width="300" height="300" rx="32" fill="#FEF2F2" stroke="#FCA5A5"/>
    <rect x="520" y="168" width="360" height="380" rx="36" fill="#FFFFFF" stroke="#93C5FD"/>
    <rect x="954" y="208" width="300" height="300" rx="32" fill="#ECFDF5" stroke="#99F6E4"/>

    <rect x="188" y="258" width="76" height="32" rx="16" fill="#FEE2E2"/>
    <text x="226" y="280" text-anchor="middle" fill="#B91C1C" font-size="14" font-weight="900">不要</text>
    <text x="188" y="340" fill="#B91C1C" font-size="27" font-weight="900">直接要结论</text>
    <text x="188" y="402" fill="#64748B" font-size="18">“帮我验证流式能力”</text>
    <text x="188" y="434" fill="#64748B" font-size="18">太模糊，无法收敛。</text>

    <text x="700" y="234" text-anchor="middle" fill="#1D4ED8" font-size="29" font-weight="900">验证工具工厂</text>
    <text x="700" y="272" text-anchor="middle" fill="#64748B" font-size="17">第一轮让 Agent 交付工具</text>
    <rect x="576" y="322" width="248" height="54" rx="18" fill="#EFF6FF" stroke="#93C5FD"/>
    <text x="700" y="356" text-anchor="middle" fill="#1D4ED8" font-size="18" font-weight="900">stream_probe</text>
    <rect x="576" y="402" width="248" height="54" rx="18" fill="#F0FDFA" stroke="#99F6E4"/>
    <text x="700" y="436" text-anchor="middle" fill="#0F766E" font-size="18" font-weight="900">fake / real 参数</text>
    <rect x="576" y="482" width="248" height="54" rx="18" fill="#FFF7ED" stroke="#FDBA74"/>
    <text x="700" y="516" text-anchor="middle" fill="#B45309" font-size="18" font-weight="900">指标 + 通过标准</text>

    <rect x="996" y="258" width="76" height="32" rx="16" fill="#CCFBF1"/>
    <text x="1034" y="280" text-anchor="middle" fill="#0F766E" font-size="14" font-weight="900">然后</text>
    <text x="996" y="340" fill="#0F766E" font-size="27" font-weight="900">环境产证据</text>
    <text x="996" y="402" fill="#64748B" font-size="18">人或 CI 运行工具，</text>
    <text x="996" y="434" fill="#64748B" font-size="18">Agent 读取证据修复。</text>

    <path d="M456 360 H506" stroke="#2563EB" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M894 360 H942" stroke="#2563EB" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>

    <rect x="330" y="606" width="740" height="48" rx="24" fill="#172033"/>
    <text x="700" y="637" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="900">工具先行：Agent 造工具，环境产事实，证据再回到 Agent</text>
  </g>
