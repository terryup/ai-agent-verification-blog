<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="author" content="zixuan" />
  <title>zixuan's blog</title>
  <link rel="stylesheet" href="shared.css" />
  <style>
    /* ── Page Header ─────────────────────────── */
    .page-intro {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 80px 32px 0;
    }

    .page-intro h1 {
      font-size: clamp(48px, 8vw, 80px);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.04em;
      color: var(--text-primary);
      text-wrap: balance;
    }

    .page-intro h1 span {
      color: var(--accent);
    }

    /* ── Blog Posts ──────────────────────────── */
    .blog-posts {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 64px 32px 96px;
    }

    .post {
      padding: 56px 0;
      border-bottom: 1px solid var(--border);
    }

    .post:first-child {
      padding-top: 0;
    }

    .post:last-child {
      border-bottom: none;
    }

    .post-title {
      font-size: clamp(32px, 5vw, 52px);
      font-weight: 800;
      line-height: 1.12;
      letter-spacing: -0.03em;
      margin-bottom: 20px;
      text-wrap: balance;
      max-width: 18ch;
    }

    .post-title a {
      color: var(--text-primary);
      text-decoration: none;
      text-decoration-thickness: 3px;
      text-underline-offset: 4px;
      transition: color var(--duration-fast) var(--ease-out);
    }

    .post-title a:hover {
      color: var(--accent);
    }

    .post-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;
    }

    .post-tag {
      display: inline-block;
      padding: 5px 14px;
      border-radius: var(--radius-full);
      font-size: 13px;
      font-weight: 600;
      background: var(--signal-soft);
      color: var(--signal);
      border: 1px solid oklch(0.7 0.18 55 / 0.2);
      transition: all var(--duration-fast) var(--ease-out);
    }

    .post-tag:hover {
      background: var(--signal);
      color: var(--bg-card);
      border-color: var(--signal);
    }

    .post-excerpt {
      font-size: 18px;
      line-height: 1.7;
      color: var(--text-secondary);
      margin-bottom: 24px;
      max-width: 55ch;
    }

    .post-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
      transition: gap var(--duration-fast) var(--ease-out);
    }

    .post-link:hover {
      gap: 14px;
      color: var(--accent-hover);
    }

    .post-link svg {
      width: 18px;
      height: 18px;
      transition: transform var(--duration-fast) var(--ease-out);
    }

    .post-link:hover svg {
      transform: translateX(4px);
    }

    /* ── Responsive ──────────────────────────── */
    @media (max-width: 640px) {
      .page-intro { padding: 48px 20px 0; }
      .page-intro h1 { font-size: clamp(36px, 10vw, 48px); }
      .blog-posts { padding: 40px 20px 64px; }
      .post { padding: 40px 0; }
      .post-title { font-size: clamp(26px, 7vw, 36px); }
      .post-excerpt { font-size: 16px; }
    }
  </style>
  <script src="theme.js"></script>
</head>
<body>

          </svg>
          <svg class="moon-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="display:none">
            <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
          </svg>
        </button>

</html>
