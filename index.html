<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="author" content="zixuan" />
  <title>zixuan's blog</title>
  <style>
    :root {
      --bg: #f7f8f4;
      --paper: #fffdfa;
      --ink: #172033;
      --muted: #627083;
      --line: #d9e0e8;
      --blue: #2563eb;
      --teal: #0f766e;
      --amber: #b45309;
      --shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      line-height: 1.76;
    }

    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── Hero ─────────────────────────────────────────── */
    .hero {
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #f7efe2 0%, #eef2ff 50%, #ecfeff 100%);
      border-bottom: 1px solid rgba(15, 23, 42, 0.08);
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 40%, rgba(37, 99, 235, 0.06) 0%, transparent 70%),
        radial-gradient(ellipse 60% 50% at 80% 60%, rgba(15, 118, 110, 0.06) 0%, transparent 70%);
    }

    .hero-inner {
      position: relative;
      max-width: 960px;
      margin: 0 auto;
      padding: 96px 28px 80px;
      text-align: center;
    }

    .hero-avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2563eb, #0f766e);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 28px;
      margin: 0 auto 24px;
      box-shadow: 0 8px 32px rgba(37, 99, 235, 0.2);
    }

    .hero-name {
      margin: 0 0 12px;
      font-size: clamp(36px, 5vw, 52px);
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    .hero-desc {
      margin: 0 auto;
      max-width: 520px;
      color: #475569;
      font-size: 18px;
      line-height: 1.65;
    }

    /* ── Articles ─────────────────────────────────────── */
    .articles {
      max-width: 960px;
      margin: 0 auto;
      padding: 56px 28px 96px;
    }

    .articles-heading {
      margin: 0 0 32px;
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .article-card {
      display: block;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 36px 40px;
      margin-bottom: 24px;
      transition: transform 200ms ease, box-shadow 200ms ease;
      color: inherit;
    }

    .article-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
      text-decoration: none;
    }

    .article-card:hover .article-title {
      color: var(--blue);
    }

    .article-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      font-size: 13px;
      color: var(--muted);
    }

    .article-meta-dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #94a3b8;
    }

    .article-title {
      margin: 0 0 12px;
      font-size: 24px;
      font-weight: 700;
      line-height: 1.3;
      color: var(--ink);
      transition: color 200ms ease;
    }

    .article-desc {
      margin: 0 0 20px;
      color: #475569;
      font-size: 16px;
      line-height: 1.65;
    }

    .article-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .article-tags span {
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 13px;
      font-weight: 600;
      color: #475569;
    }

    /* ── Footer ───────────────────────────────────────── */
    .footer {
      text-align: center;
      padding: 32px 28px;
      color: #94a3b8;
      font-size: 14px;
      border-top: 1px solid var(--line);
    }

    /* ── Responsive ───────────────────────────────────── */
    @media (max-width: 640px) {
      .hero-inner { padding: 64px 20px 56px; }
      .articles { padding: 40px 20px 72px; }
      .article-card { padding: 28px 24px; }
      .article-title { font-size: 20px; }
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div class="hero-avatar">Z</div>
      <h1 class="hero-name">zixuan</h1>
      <p class="hero-desc">复杂系统工程实践，AI 辅助开发，音视频采集架构。</p>
    </div>
  </header>

  <main class="articles">
    <p class="articles-heading">Articles</p>

    <a class="article-card" href="./ai-agent-verification.html">
      <div class="article-meta">
        <span>2025 年 6 月</span>
        <span class="article-meta-dot"></span>
        <span>复杂工程</span>
      </div>
      <h2 class="article-title">复杂工程里的 AI Agent：如何解决验证难题</h2>
      <p class="article-desc">
        AI 写代码越来越快，但复杂工程真正卡住的地方往往不是"写不出来"，而是"怎么证明它写对了"。
      </p>
      <div class="article-tags">
        <span>复杂工程</span>
        <span>验证拆层</span>
        <span>替身环境</span>
        <span>证据闭环</span>
      </div>
    </a>

    <a class="article-card" href="./ai-agent-testing-practice-blog.html">
      <div class="article-meta">
        <span>2025 年 6 月</span>
        <span class="article-meta-dot"></span>
        <span>测试架构</span>
      </div>
      <h2 class="article-title">如何设计测试 Agent：Harness 自测体系的架构方法</h2>
      <p class="article-desc">
        如何在 Harness 自测体系里驱动真实系统、采集证据、稳定评估，并输出可复查报告。
      </p>
      <div class="article-tags">
        <span>Harness 自测</span>
        <span>测试 Agent</span>
        <span>证据闭环</span>
        <span>音视频验证</span>
      </div>
    </a>
  </main>

  <footer class="footer">
    &copy; 2025 zixuan
  </footer>
</body>
</html>
