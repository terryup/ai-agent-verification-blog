<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="author" content="zixuan" />
  <title>zixuan's blog</title>
  <link rel="stylesheet" href="shared.css" />
  <style>
    .blog-posts {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 48px 32px 96px;
    }

    .post {
      padding: 40px 0;
      border-bottom: 1px solid var(--border);
    }

    .post:first-child {
      padding-top: 0;
    }

    .post:last-child {
      border-bottom: none;
    }

    .post-title {
      font-size: clamp(24px, 3.5vw, 32px);
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: -0.02em;
      margin-bottom: 16px;
      text-wrap: balance;
    }

    .post-title a {
      color: var(--text-primary);
      text-decoration: none;
      transition: color var(--duration-fast) var(--ease-out);
    }

    .post-title a:hover {
      color: var(--accent);
    }

    .post-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    .post-tag {
      display: inline-block;
      padding: 4px 12px;
      border-radius: var(--radius-full);
      font-size: 13px;
      font-weight: 600;
      background: var(--signal-soft);
      color: var(--signal);
      transition: all var(--duration-fast) var(--ease-out);
    }

    .post-tag:hover {
      background: var(--signal);
      color: var(--bg-card);
    }

    .post-excerpt {
      font-size: 17px;
      line-height: 1.7;
      color: var(--text-secondary);
      margin-bottom: 20px;
      max-width: 65ch;
    }

    .post-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 15px;
      font-weight: 600;
      color: var(--accent);
      transition: gap var(--duration-fast) var(--ease-out);
    }

    .post-link:hover {
      gap: 12px;
      color: var(--accent-hover);
    }

    @media (max-width: 640px) {
      .blog-posts { padding: 32px 20px 64px; }
      .post { padding: 32px 0; }
    }
  </style>
  <script src="theme.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a href="index.html" class="site-logo">zixuan</a>
      <nav class="site-nav">
        <a href="index.html">Home</a>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
          <svg class="sun-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
          <svg class="moon-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="display:none">
            <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
          </svg>
        </button>
      </nav>
    </div>
  </header>

  <main class="blog-posts">
    <article class="post">
      <h1 class="post-title">
        <a href="./ai-agent-verification.html">复杂工程里的 AI Agent：如何解决验证难题</a>
      </h1>
      <div class="post-tags">
        <span class="post-tag">复杂工程</span>
        <span class="post-tag">验证拆层</span>
        <span class="post-tag">替身环境</span>
        <span class="post-tag">证据闭环</span>
      </div>
      <p class="post-excerpt">
        AI 写代码越来越快，但复杂工程真正卡住的地方往往不是"写不出来"，而是"怎么证明它写对了"。

      <a class="post-link" href="./ai-agent-verification.html">阅读全文 →</a>
    </article>

    <article class="post">
      <h1 class="post-title">
        <a href="./ai-agent-testing-practice-blog.html">如何设计测试 Agent：Harness 自测体系的架构方法</a>
      </h1>
      <div class="post-tags">
        <span class="post-tag">Harness 自测</span>
        <span class="post-tag">测试 Agent</span>
        <span class="post-tag">证据闭环</span>
        <span class="post-tag">音视频验证</span>

      <p class="post-excerpt">
        如何在 Harness 自测体系里驱动真实系统、采集证据、稳定评估，并输出可复查报告。

    </article>
  </main>

  <footer class="site-footer">
    &copy; 2025 zixuan

</body>
</html>
