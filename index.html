<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="author" content="zixuan" />
  <title>zixuan's blog</title>
  <style>
    :root {
      --color-bg: hsl(0deg 0% 100%);
      --color-bg-elevated: hsl(220deg 20% 97%);
      --color-bg-sunken: hsl(220deg 20% 94%);
      --color-text: hsl(220deg 20% 10%);
      --color-text-secondary: hsl(220deg 15% 45%);
      --color-text-tertiary: hsl(220deg 10% 60%);
      --color-border: hsl(220deg 20% 90%);
      --color-border-subtle: hsl(220deg 20% 94%);
      --color-primary: hsl(240deg 80% 60%);
      --color-primary-soft: hsl(240deg 80% 60% / 0.08);
      --color-secondary: hsl(330deg 80% 55%);
      --color-accent: hsl(200deg 80% 55%);
      --color-success: hsl(145deg 70% 40%);
      --shadow-sm: 0 1px 2px hsl(220deg 20% 10% / 0.04);
      --shadow-md: 0 4px 12px hsl(220deg 20% 10% / 0.08);
      --shadow-lg: 0 12px 32px hsl(220deg 20% 10% / 0.12);
      --shadow-xl: 0 20px 48px hsl(220deg 20% 10% / 0.16);
      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-lg: 20px;
      --radius-xl: 28px;
      --max-width: 1200px;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      --font-mono: "SF Mono", "Fira Code", "Fira Mono", "Roboto Mono", monospace;
      --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
      --transition-base: 300ms cubic-bezier(0.4, 0, 0.2, 1);
      --transition-slow: 500ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="dark"] {
      --color-bg: hsl(220deg 20% 8%);
      --color-bg-elevated: hsl(220deg 20% 12%);
      --color-bg-sunken: hsl(220deg 20% 5%);
      --color-text: hsl(220deg 10% 92%);
      --color-text-secondary: hsl(220deg 15% 65%);
      --color-text-tertiary: hsl(220deg 10% 50%);
      --color-border: hsl(220deg 20% 18%);
      --color-border-subtle: hsl(220deg 20% 14%);
      --color-primary: hsl(240deg 80% 65%);
      --color-primary-soft: hsl(240deg 80% 65% / 0.12);
      --color-secondary: hsl(330deg 80% 60%);
      --color-accent: hsl(200deg 80% 60%);
      --shadow-sm: 0 1px 2px hsl(0deg 0% 0% / 0.2);
      --shadow-md: 0 4px 12px hsl(0deg 0% 0% / 0.3);
      --shadow-lg: 0 12px 32px hsl(0deg 0% 0% / 0.4);
      --shadow-xl: 0 20px 48px hsl(0deg 0% 0% / 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      color: var(--color-text);
      background: var(--color-bg);
      font-family: var(--font-sans);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background var(--transition-base), color var(--transition-base);
    }

    a {
      color: var(--color-primary);
      text-decoration: none;
      transition: color var(--transition-fast);
    }
    a:hover { color: var(--color-secondary); }

    /* ── Header ──────────────────────────────────── */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: hsl(0deg 0% 100% / 0.8);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid var(--color-border-subtle);
      transition: background var(--transition-base), border-color var(--transition-base);
    }

    [data-theme="dark"] .site-header {
      background: hsl(220deg 20% 8% / 0.8);
    }

    .site-header-inner {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 18px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .site-logo {
      font-size: 20px;
      font-weight: 800;
      color: var(--color-text);
      letter-spacing: -0.03em;
      text-decoration: none;
      transition: color var(--transition-fast);
    }

    .site-logo span {
      background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .site-nav {
      display: flex;
      align-items: center;
      gap: 32px;
      font-size: 15px;
      font-weight: 500;
    }

    .site-nav a {
      color: var(--color-text-secondary);
      text-decoration: none;
      transition: color var(--transition-fast);
    }
    .site-nav a:hover { color: var(--color-text); }

    .theme-toggle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--color-border);
      background: var(--color-bg-elevated);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-fast);
    }
    .theme-toggle:hover {
      border-color: var(--color-primary);
      background: var(--color-primary-soft);
    }
    .theme-toggle svg {
      width: 20px;
      height: 20px;
      color: var(--color-text-secondary);
      transition: color var(--transition-fast), transform var(--transition-base);
    }
    .theme-toggle:hover svg {
      color: var(--color-primary);
      transform: rotate(15deg);
    }

    /* ── Hero ────────────────────────────────────── */
    .hero {
      position: relative;
      padding: 120px 32px 80px;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 20%, var(--color-primary-soft) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 30%, hsl(330deg 80% 55% / 0.06) 0%, transparent 60%),
        radial-gradient(ellipse 70% 50% at 50% 80%, hsl(200deg 80% 55% / 0.06) 0%, transparent 60%);
      animation: heroGlow 8s ease-in-out infinite alternate;
    }

    @keyframes heroGlow {
      0% { opacity: 0.6; transform: scale(1); }
      100% { opacity: 1; transform: scale(1.05); }
    }

    .hero-inner {
      position: relative;
      max-width: var(--max-width);
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 64px;
      animation: fadeInUp 800ms ease-out both;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hero-text { flex: 1; }

    .hero-avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--color-primary), var(--color-secondary), var(--color-accent));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 800;
      font-size: 48px;
      flex-shrink: 0;
      box-shadow: var(--shadow-xl);
      animation: avatarFloat 6s ease-in-out infinite;
    }

    @keyframes avatarFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    .hero-name {
      font-size: clamp(48px, 7vw, 72px);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.05;
      margin-bottom: 24px;
      background: linear-gradient(135deg, var(--color-text) 0%, var(--color-text-secondary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero-links {
      display: flex;
      gap: 16px;
      margin-top: 32px;
    }

    .hero-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: var(--radius-md);
      font-size: 15px;
      font-weight: 600;
      border: 1px solid var(--color-border);
      color: var(--color-text);
      background: var(--color-bg-elevated);
      transition: all var(--transition-fast);
    }
    .hero-link:hover {
      border-color: var(--color-primary);
      color: var(--color-primary);
      background: var(--color-primary-soft);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    .hero-link svg {
      width: 18px;
      height: 18px;
    }

    /* ── Articles ────────────────────────────────── */
    .articles-section {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 80px 32px 120px;
    }

    .section-heading {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 48px;
      animation: fadeInUp 800ms ease-out 200ms both;
    }

    .section-heading h2 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .section-heading::after {
      content: "";
      flex: 1;
      height: 2px;
      background: linear-gradient(90deg, var(--color-border) 0%, transparent 100%);
    }

    .article-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 32px;
    }

    .article-card {
      position: relative;
      display: flex;
      flex-direction: column;
      background: var(--color-bg-elevated);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: all var(--transition-base);
      color: inherit;
      animation: fadeInUp 800ms ease-out both;
    }

    .article-card:nth-child(1) { animation-delay: 400ms; }
    .article-card:nth-child(2) { animation-delay: 600ms; }

    .article-card:hover {
      transform: translateY(-8px);
      box-shadow: var(--shadow-xl);
      border-color: var(--color-primary);
      text-decoration: none;
    }

    .article-card-banner {
      height: 200px;
      position: relative;
      overflow: hidden;
    }

    .article-card-banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform var(--transition-slow);
    }

    .article-card:hover .article-card-banner img {
      transform: scale(1.08);
    }

    .article-card-banner::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 30%, hsl(220deg 20% 10% / 0.7) 100%);
    }

    .article-card-body {
      padding: 32px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .article-card-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: var(--color-text-tertiary);
      margin-bottom: 16px;
    }

    .article-card-meta-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--color-text-tertiary);
    }

    .article-card-title {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      color: var(--color-text);
      transition: color var(--transition-fast);
    }

    .article-card:hover .article-card-title {
      color: var(--color-primary);
    }

    .article-card-desc {
      font-size: 16px;
      color: var(--color-text-secondary);
      line-height: 1.65;
      flex: 1;
    }

    .article-card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 24px;
    }

    .tag {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.01em;
      background: var(--color-primary-soft);
      color: var(--color-primary);
      transition: all var(--transition-fast);
    }

    .article-card:hover .tag {
      background: var(--color-primary);
      color: #fff;
    }

    /* ── Footer ──────────────────────────────────── */
    .site-footer {
      border-top: 1px solid var(--color-border-subtle);
      padding: 48px 32px;
      text-align: center;
      color: var(--color-text-tertiary);
      font-size: 14px;
      transition: border-color var(--transition-base);
    }

    /* ── Responsive ──────────────────────────────── */
    @media (max-width: 768px) {
      .hero { padding: 80px 24px 60px; }
      .hero-inner { flex-direction: column; text-align: center; gap: 32px; }
      .hero-links { justify-content: center; }
      .articles-section { padding: 60px 24px 80px; }
      .article-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <script>
    const themeToggle = document.getElementById('themeToggle');
    const sunIcon = themeToggle.querySelector('.sun-icon');
    const moonIcon = themeToggle.querySelector('.moon-icon');

    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('theme', theme);
      if (theme === 'dark') {
        sunIcon.style.display = 'none';
        moonIcon.style.display = 'block';
      } else {
        sunIcon.style.display = 'block';
        moonIcon.style.display = 'none';
      }
    }

    const savedTheme = localStorage.getItem('theme') ||
      (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    setTheme(savedTheme);

    themeToggle.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme');
      setTheme(current === 'dark' ? 'light' : 'dark');
    });
  </script>
